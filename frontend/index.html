<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Domine a arena do conhecimento na TryHard Academy! Desafie jogadores online respondendo questões de matemática, português, ciências e muito mais. Suba no ranking global e desbloqueie skins exclusivas neste jogo multiplayer de agilidade mental." />
    <meta name="keywords" content="jogo educativo, matemática, ciências, história, português, multiplayer, arena, io game, browser game, tryhard academy, jogo de conhecimento" />
    <meta name="theme-color" content="#bc13fe" />
    
    <!-- Preconnect to critical third-party origins (DNS+TLS warm-up while JS parses) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.pixabay.com" />
    <link rel="dns-prefetch" href="https://image2url.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TryHard Academy - A Arena do Conhecimento" />
    <meta property="og:description" content="Desafie jogadores online respondendo questões de várias matérias e lute na arena multiplayer!" />
    <meta property="og:image" content="./logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TryHard Academy - A Arena do Conhecimento" />
    <meta name="twitter:description" content="Desafie jogadores online respondendo questões de várias matérias e lute na arena multiplayer!" />
    <meta name="twitter:image" content="./logo.png" />

    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>TryHard Academy - A Arena do Conhecimento</title>
    
    <style>
      /* Critical inline CSS - paints dark background before JS loads (avoids white flash) */
      html, body { margin: 0; padding: 0; background: #050505; color: #fff; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback de segurança: se o JS principal falhar ao carregar por
      // mais de 8s (chunk stale, offline, etc), mostra um botão de reload
      // em vez de deixar a tela em branco para sempre.
      (function () {
        var loaded = false;
        window.addEventListener('app-ready', function () { loaded = true; });
        window.addEventListener('load', function () { loaded = true; });
        setTimeout(function () {
          if (loaded) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#fff">' +
              '<div style="width:64px;height:64px;border-radius:50%;background:rgba(188,19,254,0.1);border:2px solid rgba(188,19,254,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse 2s infinite">' +
                '<span style="font-size:28px">⚡</span>' +
              '</div>' +
              '<h1 style="font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px">TryHard Academy</h1>' +
              '<p style="color:#a1a1aa;max-width:320px;margin:0 0 24px;line-height:1.5">Não foi possível carregar a versão mais recente. Verifique sua conexão e tente novamente.</p>' +
              '<button onclick="window.location.reload(true)" style="background:#06b6d4;color:#000;border:0;padding:14px 28px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px">TENTAR NOVAMENTE</button>' +
              '<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style>' +
            '</div>';
        }, 8000);
      })();
    </script>
  </body>
</html>
